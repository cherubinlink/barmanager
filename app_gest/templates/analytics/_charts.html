<script>
  /* Fixe la hauteur de chaque colonne par rapport à la plus grande valeur du graphique */
  (function () {
    document.querySelectorAll('[data-chart]').forEach(function (group) {
      var els = Array.prototype.slice.call(group.querySelectorAll('[data-v]'));
      var max = 1;
      els.forEach(function (e) { max = Math.max(max, parseFloat(e.dataset.v) || 0); });
      els.forEach(function (e) {
        var v = parseFloat(e.dataset.v) || 0;
        e.style.setProperty('--p', v > 0 ? Math.max(v / max * 100, 3) : 1);
      });
    });
  })();
</script>
